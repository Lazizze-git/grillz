name: Deploy to Infomaniak

on:
  push:
    branches: [main]
    # L'espace d'édition et les workflows ne font pas partie du site :
    # les modifier n'a aucune raison de renvoyer les pages en production.
    paths-ignore:
      - 'studio/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
