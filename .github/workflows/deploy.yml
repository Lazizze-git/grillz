# Envoie le site sur Infomaniak, contenu déjà inscrit dans les pages.
#
# Trois déclencheurs :
#   - une modification du site dans le dépôt
#   - une publication depuis l'espace d'édition (via son déclencheur)
#   - un lancement à la main depuis l'onglet Actions

name: Deploy to Infomaniak

on:
  push:
    branches: [main]
    # Ce qui ne change pas ce que reçoit le visiteur n'a pas à le renvoyer.
    paths-ignore:
      - '.github/**'
      - 'studio/schemaTypes/**'
      - 'studio/structure.ts'
      - 'studio/sanity.*'
      - 'studio/README.md'
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Une publication et un envoi de code au même moment ne doivent pas se
# marcher dessus : le second attend la fin du premier.
concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Installer les dépendances
        working-directory: studio
        run: npm ci

      - name: Assembler le module d'aperçu
        working-directory: studio
        run: npm run build:preview

      - name: Inscrire le contenu publié dans les pages
        working-directory: studio
        run: npm run prerender

      # Le formulaire de contact écrit à l'atelier par SMTP authentifié
      # (fonction mail() désactivée chez Infomaniak). Les identifiants viennent
      # des secrets du dépôt et ne sont écrits que dans le dossier envoyé.
      - name: Identifiants d'envoi du formulaire
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::Secret SMTP_PASSWORD absent : le formulaire de contact n'enverra rien tant que la fonction mail() n'est pas activée chez Infomaniak."
            exit 0
          fi
          node -e '
            const q = (s) => "\x27" + String(s).replace(/\\/g, "\\\\").replace(/\x27/g, "\\\x27") + "\x27";
            const e = process.env;
            const php = "<?php\nreturn [\n" +
              "  \"host\" => " + q(e.SMTP_HOST || "mail.infomaniak.com") + ",\n" +
              "  \"port\" => " + (parseInt(e.SMTP_PORT, 10) || 465) + ",\n" +
              "  \"user\" => " + q(e.SMTP_USER || "contact@maison-alliani.com") + ",\n" +
              "  \"password\" => " + q(e.SMTP_PASSWORD) + ",\n" +
              "];\n";
            require("fs").writeFileSync("dist/smtp-config.php", php, { mode: 0o600 });
          '

      - name: Envoyer sur le serveur
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

      - name: Récapitulatif
        run: |
          {
            echo "### Site déployé"
            echo ""
            echo "Pages calculées avec le contenu publié : plus aucune photo"
            echo "écrite en dur ne subsiste dans le HTML livré."
            if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
              echo ""
              echo "Déclenché par une publication depuis l'espace d'édition."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
